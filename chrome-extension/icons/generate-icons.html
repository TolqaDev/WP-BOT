<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator</title>
</head>
<body>
  <h1>WhatsApp BOT Icon Generator</h1>
  <p>Aşağıdaki butonlara tıklayarak ikonları indirin:</p>

  <canvas id="canvas16" width="16" height="16"></canvas>
  <canvas id="canvas32" width="32" height="32"></canvas>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas128" width="128" height="128"></canvas>

  <br><br>

  <button onclick="downloadIcon(16)">Download 16x16</button>
  <button onclick="downloadIcon(32)">Download 32x32</button>
  <button onclick="downloadIcon(48)">Download 48x48</button>
  <button onclick="downloadIcon(128)">Download 128x128</button>

  <script>
    function drawIcon(ctx, size) {
      // Background
      ctx.fillStyle = '#00983A';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.15);
      ctx.fill();

      // WhatsApp icon (simplified)
      const center = size / 2;
      const radius = size * 0.35;

      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.fill();

      // Phone icon inside
      ctx.fillStyle = '#00983A';
      ctx.beginPath();
      ctx.arc(center, center, radius * 0.6, 0, Math.PI * 2);
      ctx.fill();

      // Phone shape
      ctx.fillStyle = 'white';
      ctx.font = `${size * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📱', center, center);
    }

    function generateIcons() {
      [16, 32, 48, 128].forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');

        // Simple rounded rect with WhatsApp-like design
        ctx.fillStyle = '#00983A';
        const r = size * 0.15;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.fill();

        // W letter
        ctx.fillStyle = 'white';
        ctx.font = `bold ${size * 0.5}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('W', size/2, size/2);
      });
    }

    function downloadIcon(size) {
      const canvas = document.getElementById(`canvas${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    generateIcons();
  </script>
</body>
</html>
